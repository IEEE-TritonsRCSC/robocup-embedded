profiles:
  unoq:
    fqbn: arduino:zephyr:unoq:link_mode=dynamic,wait_linux_boot=yes
    platforms:
      - platform: arduino:zephyr (0.55.0)
    libraries:
      - Arduino_RouterBridge (0.4.1)
      - Arduino_RPClite (0.2.1)
      - MsgPack (0.4.2)
      - DebugLog (0.8.4)
      - ArxTypeTraits (0.3.2)
      - ArxContainer (0.7.0)
    programmer: ""
    port: COM5
    port_config:
      baudrate: "115200"
      lineEnding: "\r\n"
      bits: "8"
      parity: none
      stop_bits: one
    notes: Arduino UnoQ for the RoboCup Embedded Software
default_profile: unoq
